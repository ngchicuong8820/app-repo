apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://victoriametrics.github.io/helm-charts/'
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.35.0
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: operator.victoriametrics.com
      kind: VMSingle
      jsonPointers:
        - /status
    - group: operator.victoriametrics.com
      kind: VMAlertmanager
      jsonPointers:
        - /status
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    - group: ""
      kind: ConfigMap
      name: victoria-metrics-victoria-metrics-k8s-stack-node-exporter-full
      jsonPointers:
        - /metadata/annotations
    - group: ""
      kind: Service
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels